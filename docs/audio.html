<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One more thing 🎧</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffd6e7;--lav:#e4d9ff;--sky:#d6ecff;--ink:#5b4b6b;--acc:#ff8fb8;--acc2:#b79cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Fredoka','Nunito',system-ui,sans-serif;color:var(--ink);
background:linear-gradient(135deg,var(--pink),var(--lav) 50%,var(--sky));display:flex;justify-content:center;align-items:flex-start;padding:24px 14px;overflow-x:hidden}
.float{position:fixed;font-size:28px;opacity:.5;animation:fl 6s ease-in-out infinite;pointer-events:none}
@keyframes fl{50%{transform:translateY(-14px) rotate(8deg)}}
.card{position:relative;z-index:1;width:100%;max-width:520px;background:#fffafc;border-radius:32px;padding:28px 22px;
box-shadow:0 10px 30px #b79cff44,0 0 0 5px #fff;text-align:center;margin-top:4vh}
h1{font-size:28px;margin:8px 0;line-height:1.2}p{margin:10px 0;font-size:17px}.big{font-size:70px;line-height:1}
audio{width:100%;margin:12px 0;border-radius:99px}
.q{font-size:20px;font-weight:600;margin:16px 0 8px}
.field{font-family:inherit;font-size:18px;padding:12px 18px;border-radius:99px;border:3px solid var(--lav);width:100%;text-align:center;color:var(--ink);margin:8px 0;outline:0}
.field:focus{border-color:var(--acc)}.msg{min-height:24px;margin-top:8px;color:#d6557f;font-weight:500}
button,.btn{font-family:inherit;cursor:pointer;border:0;color:#fff;font-size:18px;font-weight:600;padding:12px 28px;border-radius:999px;text-decoration:none;display:inline-block;
background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 5px 0 #d97aa4;transition:.12s;margin:6px}
button:hover,.btn:hover{transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 2px 0 #d97aa4}
.photo{width:300px;max-width:88%;height:auto;border-radius:24px;box-shadow:0 8px 22px #b79cff55;margin:10px auto;display:block}
</style></head><body>
<span class="float" style="left:6%;top:10%">🌸</span><span class="float" style="right:8%;top:16%;animation-delay:1s">🎀</span>
<span class="float" style="left:10%;bottom:12%;animation-delay:2s">☁️</span><span class="float" style="right:7%;bottom:18%;animation-delay:3s">⭐</span>
<main class="card" id="app"><p>Loading…</p></main>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const T=new URLSearchParams(location.search).get('t')||'';
async function api(body){
 const r=await fetch(window.API_URL+'/api/audio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error||'something went wrong 🥺');
 return j;}

function locked(msg){$('#app').innerHTML='<div class="big">🔒</div><h1>Not yet!</h1><p></p>';$('#app p').textContent=msg;}

function question(){
 $('#app').innerHTML=`<div class="big">🎧</div><h1>One more thing…</h1><p>Press play 💌</p>
 <audio controls preload="auto"><source src="audio/clip.mp3" type="audio/mpeg"><source src="audio/clip.ogg" type="audio/ogg"></audio>
 <div class="q">What was in the other audio clip I sent along with this one?</div>
 <input id="ans" class="field" placeholder="type what it said…" autocomplete="off" spellcheck="false">
 <button id="ok">Check ✨</button><div class="msg" id="msg"></div>`;
 let busy=false;
 const go=async()=>{
  if(busy)return;const v=$('#ans').value.trim();
  if(!v){$('#msg').textContent='Type your answer first 🌸';return;}
  busy=true;$('#msg').textContent='Checking…';
  try{const r=await api({t:T,answer:v});
   if(r.correct)return win(r.link);
   $('#msg').textContent='Hmm, that’s not what I said 🥲 listen to the other clip again!';
  }catch(e){$('#msg').textContent=e.message}
  busy=false;};
 $('#ok').onclick=go;$('#ans').onkeydown=e=>e.key==='Enter'&&go();
}

function win(link){
 $('#app').innerHTML=`<h1>Muehehehe 😼💖</h1><img class="photo" src="img/muehehe-cat.png" alt="a giggling kitten"><p>You really do know me ✨<br>Here’s your final link:</p>
 <p><a class="btn" id="go" target="_blank" rel="noopener">Open it 💌</a></p>`;
 if(/^https?:\/\//i.test(link))$('#go').href=link;
}

(async()=>{try{await api({t:T});question()}catch(e){locked(e.message)}})();
</script></body></html>
